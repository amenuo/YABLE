<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>YABLE app icon</title>
  <desc>A Bluetooth Low Energy debugger icon with cyan signal rings, circuit nodes, and a Bluetooth rune.</desc>
  <defs>
    <linearGradient id="bg" x1="38" y1="28" x2="218" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="64" y1="48" x2="202" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
      <stop offset="0.65" stop-color="#22d3ee" stop-opacity="0.08"/>
